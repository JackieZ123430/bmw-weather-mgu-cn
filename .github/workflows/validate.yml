name: Validate BMW Weather source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JSON manifests
        run: |
          python -m json.tool mgu-repo.json >/dev/null
          python -m json.tool apps/flash8523_bmw_weather/app.json >/dev/null
      - name: Check Python build script syntax
        run: python -m py_compile tools/build_unit.py
      - name: Check JavaScript syntax
        run: |
          find apps/flash8523_bmw_weather -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/weather-normalize.js
      - name: Test weather normalization
        run: node tests/weather-normalize.js
